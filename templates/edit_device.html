{% extends "base.html" %}

{% block title %}Edit Device - AttendanceMS{% endblock %}
{% block page_title %}Edit Device{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <a href="{{ url_for('devices') }}" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-brand-600 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Back to Devices
    </a>
  </div>

  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200">
      <h3 class="font-semibold text-slate-900">Edit Device</h3>
      <p class="text-sm text-slate-500 mt-1">Update this device's connection details or status.</p>
    </div>

    <form method="POST" action="{{ url_for('edit_device', device_id=device.DeviceID) }}" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Device Name <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          name="device_name"
          value="{{ device.DeviceName }}"
          required
          maxlength="100"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Serial Number <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          name="serial_number"
          value="{{ device.SerialNumber }}"
          required
          maxlength="100"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Device Type</label>
        <select
          name="device_type"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        >
          <option value="" {% if not device.DeviceType %}selected{% endif %}>Select type</option>
          {% for t in ["Biometric Terminal", "Fingerprint Scanner", "Face Recognition", "Card Reader", "RFID Reader", "Other"] %}
          <option value="{{ t }}" {% if device.DeviceType == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Model</label>
        <input
          type="text"
          name="model"
          value="{{ device.Model or '' }}"
          maxlength="100"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">IP Address</label>
        <input
          type="text"
          name="ip_address"
          value="{{ device.IPAddress or '' }}"
          maxlength="50"
          pattern="^(\d{1,3}\.){3}\d{1,3}$"
          title="Enter a valid IPv4 address"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Port</label>
        <input
          type="number"
          name="port"
          value="{{ device.Port or '' }}"
          min="1"
          max="65535"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-1">Location</label>
        <input
          type="text"
          name="location"
          value="{{ device.Location or '' }}"
          maxlength="150"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
        <textarea
          name="notes"
          rows="3"
          maxlength="500"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        >{{ device.Notes or '' }}</textarea>
      </div>

      <div class="md:col-span-2 flex items-center gap-2">
        <input
          type="checkbox"
          id="status"
          name="status"
          {% if device.Status %}checked{% endif %}
          class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500"
        />
        <label for="status" class="text-sm font-medium text-slate-700">Device is active</label>
      </div>

      <div class="md:col-span-2 flex justify-end gap-3 pt-2">
        <a href="{{ url_for('devices') }}" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</a>
        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
