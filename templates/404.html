{% extends 'base.html' %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center">
    <h1 class="text-6xl font-bold text-slate-800 mb-4">404</h1>
    <h2 class="text-2xl font-semibold text-slate-600 mb-6">Page Not Found</h2>
    <p class="text-slate-500 mb-8 max-w-md">The page you are looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors">
        Return to Dashboard
    </a>
</div>
{% endblock %}
