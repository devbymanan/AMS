{% extends "base.html" %}

{% block title %}Edit Roster - AttendanceMS{% endblock %}
{% block page_title %}Edit Roster{% endblock %}

{% block content %}

<div class="bg-white rounded-xl border border-slate-200 max-w-lg">
  <div class="px-6 py-4 border-b border-slate-200">
    <h3 class="font-semibold text-slate-900">Edit Roster</h3>
  </div>
  <form method="POST" action="{{ url_for('edit_roster', roster_id=roster.RosterID) }}" class="px-6 py-4 space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
        <input type="date" name="roster_date" value="{{ roster.RosterDate }}" required
               class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Shift</label>
        <select name="shift_id" required
                class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
          {% for shift in shifts %}
          <option value="{{ shift.ShiftID }}" {% if shift.ShiftID|string == roster.ShiftID|string %}selected{% endif %}>
            {{ shift.ShiftName }}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Team Name (optional)</label>
      <input type="text" name="team_name" value="{{ roster.TeamName or '' }}" placeholder="e.g. Warehouse Loading Team"
             class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Employees</label>
      <div class="border border-slate-200 rounded-lg max-h-48 overflow-y-auto divide-y divide-slate-100">
        {% for emp in employees %}
        <label class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" name="employee_ids" value="{{ emp.EmployeeID }}"
                 {% if emp.EmployeeID|string in assigned_ids %}checked{% endif %}
                 class="rounded border-slate-300 text-brand-600 focus:ring-brand-500">
          {{ emp.FullName }}
        </label>
        {% endfor %}
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Notes (optional)</label>
      <textarea name="notes" rows="2"
                class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">{{ roster.Notes or '' }}</textarea>
    </div>
    <div class="flex justify-end gap-3 pt-2">
      <a href="{{ url_for('roster') }}" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</a>
      <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition">Save Changes</button>
    </div>
  </form>
</div>

{% endblock %}
