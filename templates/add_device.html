{% extends "base.html" %}

{% block title %}Add Device - AttendanceMS{% endblock %}
{% block page_title %}Add Device{% endblock %}

{% block content %}

<form method="POST" action="{{ url_for('add_device') }}" class="space-y-6">

  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200">
      <h3 class="font-semibold text-slate-900">Device Information</h3>
      <p class="text-sm text-slate-500 mt-0.5">Register a biometric terminal, card reader, or scanner.</p>
    </div>

    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Device Name <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          name="device_name"
          required
          maxlength="100"
          placeholder="e.g. Main Gate Terminal"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Serial Number <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          name="serial_number"
          required
          maxlength="100"
          placeholder="Device serial / terminal SN"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Device Type</label>
        <select
          name="device_type"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        >
          <option value="">Select type</option>
          <option value="Biometric Terminal">Biometric Terminal</option>
          <option value="Fingerprint Scanner">Fingerprint Scanner</option>
          <option value="Face Recognition">Face Recognition</option>
          <option value="Card Reader">Card Reader</option>
          <option value="RFID Reader">RFID Reader</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Model</label>
        <input
          type="text"
          name="model"
          maxlength="100"
          placeholder="e.g. ZKTeco uFace 800"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">IP Address</label>
        <input
          type="text"
          name="ip_address"
          maxlength="50"
          placeholder="192.168.1.50"
          pattern="^(\d{1,3}\.){3}\d{1,3}$"
          title="Enter a valid IPv4 address"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Port</label>
        <input
          type="number"
          name="port"
          min="1"
          max="65535"
          placeholder="4370"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-1">Location</label>
        <input
          type="text"
          name="location"
          maxlength="150"
          placeholder="e.g. Warehouse - Main Entrance"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
        <textarea
          name="notes"
          rows="3"
          maxlength="500"
          placeholder="Optional notes about this device"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        ></textarea>
      </div>

      <div class="md:col-span-2 flex items-center gap-2">
        <input
          type="checkbox"
          id="status"
          name="status"
          checked
          class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500"
        />
        <label for="status" class="text-sm font-medium text-slate-700">Device is active</label>
      </div>
    </div>
  </div>

  <div class="flex justify-end gap-3">
    <a
      href="{{ url_for('devices') }}"
      class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition"
    >
      Cancel
    </a>
    <button
      type="submit"
      class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition"
    >
      Save Device
    </button>
  </div>
</form>

{% endblock %}
