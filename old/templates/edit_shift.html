{% extends "base.html" %}

{% block title %}Edit Shift - AttendanceMS{% endblock %}
{% block page_title %}Edit Shift{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <a href="{{ url_for('shifts') }}" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-brand-600 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Back to Shifts
    </a>
  </div>

  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200">
      <h3 class="font-semibold text-slate-900">Edit Shift</h3>
      <p class="text-sm text-slate-500 mt-1">Update shift timing, grace period, or working hours.</p>
    </div>

    <form method="POST" action="{{ url_for('edit_shift', shift_id=shift.ShiftID) }}" class="p-6 space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Shift Name</label>
        <input
          type="text"
          name="shift_name"
          value="{{ shift.ShiftName }}"
          required
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Start Time</label>
          <input
            type="time"
            name="start_time"
            value="{{ shift.StartTime }}"
            required
            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">End Time</label>
          <input
            type="time"
            name="end_time"
            value="{{ shift.EndTime }}"
            required
            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Grace Period (minutes)</label>
          <input
            type="number"
            name="grace_period"
            value="{{ shift.GracePeriod or 0 }}"
            min="0"
            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Working Hours</label>
          <input
            type="number"
            step="0.5"
            name="working_hours"
            value="{{ shift.WorkingHours or 0 }}"
            required
            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
          />
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <a href="{{ url_for('shifts') }}" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</a>
        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
